<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Programming c·quiz </title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Fira Code', 'Courier New', monospace;
    }

    body {
      background: linear-gradient(145deg, #0b0f1c 0%, #141b2b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #e3e9f2;
    }

    .quiz-container {
      max-width: 850px;
      width: 100%;
      background: rgba(18, 25, 40, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid #2e3b4e;
      border-radius: 2.5rem;
      padding: 2rem 2rem 2rem 2rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.05);
      transition: all 0.2s;
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 1.6rem;
      animation: fade 0.25s ease;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glitch-title {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #b7e1fa;
      text-shadow: 0 0 8px #3b8fc2, 0 0 20px #2a5f8a;
      line-height: 1.2;
      text-align: center;
    }

    .glitch-title span {
      color: #f5c542;
      text-shadow: 0 0 10px #f5b81b;
    }

    .subhead {
      text-align: center;
      color: #9aaec9;
      font-size: 1.1rem;
      border-bottom: 1px dashed #2f405b;
      padding-bottom: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .start-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      background: #0e1421;
      padding: 2rem 1.5rem;
      border-radius: 2rem;
      border: 1px solid #253247;
      box-shadow: inset 0 0 15px #00000033;
    }

    .start-card p {
      font-size: 1.2rem;
      color: #b0c4de;
      text-align: center;
      max-width: 500px;
    }

    .start-btn, .next-btn, .restart-btn, .end-btn {
      background: #1d2b3f;
      border: none;
      padding: 1rem 2.8rem;
      font-size: 1.4rem;
      font-weight: 600;
      font-family: 'Fira Code', monospace;
      color: #d3e6ff;
      border-radius: 3rem;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid #3e5670;
      box-shadow: 0 6px 0 #0b0f18, 0 8px 16px #00000050;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    .start-btn:hover, .next-btn:hover, .restart-btn:hover, .end-btn:hover {
      background: #263b55;
      border-color: #5f7e9e;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #0b0f18, 0 12px 22px #00000060;
      color: white;
    }

    .start-btn:active, .next-btn:active, .end-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0b0f18, 0 6px 12px #00000050;
    }

    .end-btn {
      background: #2c1a1f;
      border-color: #7a3a4a;
      color: #ffb8c6;
      padding: 0.9rem 2rem;
      font-size: 1.1rem;
      box-shadow: 0 4px 0 #0b0f18;
    }

    .end-btn:hover {
      background: #3d2229;
      border-color: #b35c70;
      color: #ffd0d9;
    }

    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #84a5c9;
      font-size: 0.95rem;
      font-weight: 400;
      background: #0a111e;
      padding: 0.7rem 1.5rem;
      border-radius: 3rem;
      border: 1px solid #1f2d41;
    }

    .question-text {
      font-size: 1.25rem;
      color: #c9ddf5;
      background: #0b121f;
      padding: 1rem 1.5rem;
      border-radius: 1.5rem;
      border-left: 5px solid #f5c542;
      line-height: 1.5;
      font-weight: 400;
      word-break: break-word;
    }

    .code-block {
      background: #0a0e17;
      padding: 1.5rem 1.8rem;
      border-radius: 1.5rem;
      border: 1px solid #26334a;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 1.05rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: #d4e3ff;
      box-shadow: inset 0 0 20px #00000055, 0 4px 0 #05080e;
      margin: 0.5rem 0;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .input-area label {
      font-size: 0.95rem;
      color: #99b5d4;
      letter-spacing: 0.3px;
    }

    .answer-input {
      background: #101927;
      border: 2px solid #2c3f58;
      border-radius: 3rem;
      padding: 1rem 1.6rem;
      font-size: 1.15rem;
      font-family: 'Fira Code', monospace;
      color: #e6f0ff;
      outline: none;
      transition: 0.2s;
      width: 100%;
    }

    .answer-input:focus {
      border-color: #f5c542;
      box-shadow: 0 0 12px #f5c54233;
      background: #0d1422;
    }

    .answer-input::placeholder {
      color: #4e617c;
      font-style: italic;
    }

    .action-row {
      display: flex;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .action-row-left {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .action-row-right {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .next-btn {
      padding: 0.9rem 2.4rem;
      font-size: 1.2rem;
      box-shadow: 0 4px 0 #0b0f18;
    }

    .feedback {
      font-size: 1rem;
      padding: 0.6rem 1rem;
      border-radius: 2rem;
      background: #0e1825;
      border: 1px solid #2d405a;
      color: #b8d0ee;
      min-height: 2.8rem;
      display: flex;
      align-items: center;
      transition: 0.15s;
    }

    .feedback.correct {
      background: #0b2c1f;
      border-color: #2e9b6b;
      color: #b5ffd6;
      box-shadow: 0 0 12px #1a7a4e33;
    }

    .feedback.wrong {
      background: #2c101a;
      border-color: #b3445e;
      color: #ffbfcf;
    }

    .result-title {
      font-size: 2.8rem;
      font-weight: 700;
      text-align: center;
      color: #b7e1fa;
      text-shadow: 0 0 15px #2470a0;
    }

    .score-badge {
      font-size: 4.5rem;
      font-weight: 800;
      text-align: center;
      color: #f5c542;
      text-shadow: 0 0 20px #f5b81b;
      line-height: 1;
      margin: 0.5rem 0;
    }

    .result-message {
      text-align: center;
      font-size: 1.3rem;
      color: #c1d9f0;
      padding: 1rem;
      background: #0a121f;
      border-radius: 2rem;
      border: 1px solid #253952;
    }

    .restart-btn {
      align-self: center;
      margin-top: 0.8rem;
      padding: 1rem 3rem;
    }

    .mini-note {
      font-size: 0.85rem;
      color: #57708c;
      text-align: center;
    }

    @media (max-width: 650px) {
      .quiz-container { padding: 1.5rem; }
      .glitch-title { font-size: 2.4rem; }
      .code-block { font-size: 0.95rem; padding: 1rem; }
      .question-text { font-size: 1.1rem; }
      .action-row { flex-direction: column; }
      .action-row-left, .action-row-right { width: 100%; justify-content: center; }
      .end-btn { width: 100%; justify-content: center; }
      .next-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="quiz-container">

  <!-- START SCREEN -->
  <div id="startScreen" class="screen active">
    <div class="glitch-title">
      <span>⚡</span> c·quiz <span>⚡</span>
    </div>
    <div class="subhead">30 shuffled questions — arrays & basics</div>
    <div class="start-card">
      <p>› 30 questions (shuffled)<br>› type the exact output or value<br>› end anytime to get a partial score</p>
      <button class="start-btn" id="startQuizBtn">▶ start_quiz()</button>
      <div class="mini-note">// no name entry, just code</div>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="screen">
    <div class="progress">
      <span id="questionCounter">question 1 / 30</span>
      <span id="scoreDisplay">score: 0</span>
    </div>
    <div class="question-text" id="questionText">Loading...</div>
    <div class="code-block" id="codeBlock"></div>
    <div class="input-area">
      <label for="answerInput">⌨️ your answer (exact output, no spaces unless needed)</label>
      <input type="text" id="answerInput" class="answer-input" placeholder="e.g. 42 or hello" autocomplete="off">
    </div>
    <div class="action-row">
      <div class="action-row-left">
        <button class="end-btn" id="endQuizBtn">⏹ end quiz</button>
      </div>
      <div class="action-row-right">
        <div class="feedback" id="feedbackMsg"></div>
        <button class="next-btn" id="submitBtn">submit ⏎</button>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="screen">
    <div class="result-title">quiz_complete</div>
    <div class="score-badge" id="finalScore">0/30</div>
    <div class="result-message" id="resultMessage"></div>
    <button class="restart-btn" id="restartBtn">↻ play_again()</button>
    <div class="mini-note" style="margin-top: 0.2rem;">// keep coding, keep breaking things</div>
  </div>

</div>

<script>
  // ---------- 30 QUESTIONS WITH OBFUSCATED VARIABLE NAMES ----------
  const baseQuestions = [
    { question: "What is the output of this C code?",
      code: `#include <stdio.h>\nint main() {\n    int x[3] = {10, 20, 30};\n    printf("%d", x[1] + x[2]);\n    return 0;\n}`,
      answer: "50" },
    { question: "What is the output? (watch the type!)",
      code: `#include <stdio.h>\nint main() {\n    char q[] = "hello";\n    printf("%c", q[1]);\n    return 0;\n}`,
      answer: "e" },
    { question: "What will be printed?",
      code: `#include <stdio.h>\nint main() {\n    int z[] = {2, 4, 6, 8};\n    int *w = z;\n    printf("%d", *(w + 2));\n    return 0;\n}`,
      answer: "6" },
    { question: "What is the output? (sizeof / array size)",
      code: `#include <stdio.h>\nint main() {\n    int v[5] = {1, 2, 3, 4, 5};\n    printf("%lu", sizeof(v) / sizeof(v[0]));\n    return 0;\n}`,
      answer: "5" },
    { question: "What does this print? (post-increment inside array index)",
      code: `#include <stdio.h>\nint main() {\n    int k = 0;\n    int u[3] = {100, 200, 300};\n    printf("%d", u[k++]);\n    return 0;\n}`,
      answer: "100" },
    { question: "What is the output?",
      code: `#include <stdio.h>\nint main() {\n    int t[4] = {1, 2, 3, 4};\n    printf("%d", t[0] + t[3]);\n    return 0;\n}`,
      answer: "5" },
    { question: "What character is printed?",
      code: `#include <stdio.h>\nint main() {\n    char m[] = "world";\n    printf("%c", m[4]);\n    return 0;\n}`,
      answer: "d" },
    { question: "What is the output?",
      code: `#include <stdio.h>\nint main() {\n    int r[3] = {5, 10, 15};\n    printf("%d", r[2] - r[0]);\n    return 0;\n}`,
      answer: "10" },
    { question: "What is the output? (pointer arithmetic)",
      code: `#include <stdio.h>\nint main() {\n    int y[] = {10, 20, 30, 40};\n    int *h = y + 1;\n    printf("%d", *h);\n    return 0;\n}`,
      answer: "20" },
    { question: "What is the output?",
      code: `#include <stdio.h>\nint main() {\n    int b[2] = {7, 8};\n    printf("%d", b[0] * b[1]);\n    return 0;\n}`,
      answer: "56" },
    { question: "What is the output? (string indexing)",
      code: `#include <stdio.h>\nint main() {\n    char f[] = "cprogram";\n    printf("%c", f[0]);\n    return 0;\n}`,
      answer: "c" },
    { question: "What will be printed?",
      code: `#include <stdio.h>\nint main() {\n    int c[5] = {0};\n    printf("%d", c[3]);\n    return 0;\n}`,
      answer: "0" },
    { question: "What is the output? (pointer to array)",
      code: `#include <stdio.h>\nint main() {\n    int n[] = {1, 2, 3};\n    printf("%d", *(n + 1));\n    return 0;\n}`,
      answer: "2" },
    { question: "What is the output? (array size)",
      code: `#include <stdio.h>\nint main() {\n    int d[7];\n    printf("%lu", sizeof(d) / sizeof(int));\n    return 0;\n}`,
      answer: "7" },
    { question: "What does this print? (pre-increment)",
      code: `#include <stdio.h>\nint main() {\n    int p = 0;\n    int g[3] = {10, 20, 30};\n    printf("%d", g[++p]);\n    return 0;\n}`,
      answer: "20" },
    { question: "What is the output?",
      code: `#include <stdio.h>\nint main() {\n    char j[] = "abc";\n    printf("%c", j[2]);\n    return 0;\n}`,
      answer: "c" },
    { question: "What is the output? (array + loop)",
      code: `#include <stdio.h>\nint main() {\n    int s[3] = {2, 4, 6};\n    int a = 0;\n    for(int i=0; i<3; i++) a += s[i];\n    printf("%d", a);\n    return 0;\n}`,
      answer: "12" },
    { question: "What is the output? (pointer dereference)",
      code: `#include <stdio.h>\nint main() {\n    int e[] = {9, 8, 7};\n    int *o = e + 2;\n    printf("%d", *o);\n    return 0;\n}`,
      answer: "7" },
    { question: "What is the output?",
      code: `#include <stdio.h>\nint main() {\n    int l[4] = {1, 2, 3, 4};\n    printf("%d", l[1] * l[3]);\n    return 0;\n}`,
      answer: "8" },
    { question: "What is the output? (string length logic)",
      code: `#include <stdio.h>\nint main() {\n    char i[] = "hi";\n    printf("%c", i[1]);\n    return 0;\n}`,
      answer: "i" },
    { question: "What is the output? (array initialization)",
      code: `#include <stdio.h>\nint main() {\n    int w[3] = {5};\n    printf("%d", w[1] + w[2]);\n    return 0;\n}`,
      answer: "0" },
    { question: "What is the output? (pointer arithmetic)",
      code: `#include <stdio.h>\nint main() {\n    int x[] = {2, 4, 6, 8};\n    int *v = x;\n    v += 3;\n    printf("%d", *v);\n    return 0;\n}`,
      answer: "8" },
    { question: "What is the output? (char array)",
      code: `#include <stdio.h>\nint main() {\n    char z[] = "C";\n    printf("%c", z[0]);\n    return 0;\n}`,
      answer: "C" },
    { question: "What is the output? (array index expression)",
      code: `#include <stdio.h>\nint main() {\n    int a = 1;\n    int b[3] = {100, 200, 300};\n    printf("%d", b[a + 1]);\n    return 0;\n}`,
      answer: "300" },
    { question: "What is the output? (sizeof on array)",
      code: `#include <stdio.h>\nint main() {\n    double q[4];\n    printf("%lu", sizeof(q) / sizeof(double));\n    return 0;\n}`,
      answer: "4" },
    { question: "What is the output?",
      code: `#include <stdio.h>\nint main() {\n    int k[3] = {1, 2, 3};\n    printf("%d", k[0] + k[1] + k[2]);\n    return 0;\n}`,
      answer: "6" },
    { question: "What is the output? (pointer and index)",
      code: `#include <stdio.h>\nint main() {\n    int u[] = {5, 10, 15};\n    printf("%d", *(u + 2));\n    return 0;\n}`,
      answer: "15" },
    { question: "What is the output? (character array indexing)",
      code: `#include <stdio.h>\nint main() {\n    char t[] = "code";\n    printf("%c", t[1]);\n    return 0;\n}`,
      answer: "o" },
    { question: "What is the output? (array subtraction)",
      code: `#include <stdio.h>\nint main() {\n    int r[3] = {10, 20, 30};\n    printf("%d", r[2] - r[1]);\n    return 0;\n}`,
      answer: "10" },
    { question: "What is the output? (post-increment in expression)",
      code: `#include <stdio.h>\nint main() {\n    int m = 2;\n    int n[4] = {1, 2, 3, 4};\n    printf("%d", n[m++]);\n    return 0;\n}`,
      answer: "3" }
  ];

  // ---------- state ----------
  let questions = [];
  let currentQIndex = 0;
  let score = 0;
  let answered = false;
  let correctAnswer = "";
  let answeredCount = 0;
  let quizEndedEarly = false;

  // DOM elements
  const startScreen = document.getElementById('startScreen');
  const quizScreen = document.getElementById('quizScreen');
  const resultScreen = document.getElementById('resultScreen');
  const startBtn = document.getElementById('startQuizBtn');
  const submitBtn = document.getElementById('submitBtn');
  const endQuizBtn = document.getElementById('endQuizBtn');
  const restartBtn = document.getElementById('restartBtn');
  const questionText = document.getElementById('questionText');
  const codeBlock = document.getElementById('codeBlock');
  const answerInput = document.getElementById('answerInput');
  const feedbackMsg = document.getElementById('feedbackMsg');
  const questionCounter = document.getElementById('questionCounter');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const finalScore = document.getElementById('finalScore');
  const resultMessage = document.getElementById('resultMessage');

  // ---------- helpers ----------
  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function resetQuiz() {
    questions = shuffleArray(baseQuestions);
    currentQIndex = 0;
    score = 0;
    answered = false;
    answeredCount = 0;
    quizEndedEarly = false;
    updateScoreDisplay();
    answerInput.value = '';
    feedbackMsg.textContent = '';
    feedbackMsg.className = 'feedback';
    answerInput.disabled = false;
    answerInput.focus();
    submitBtn.textContent = 'submit ⏎';
    endQuizBtn.disabled = false;
  }

  function updateScoreDisplay() {
    scoreDisplay.textContent = `score: ${score}`;
  }

  function loadQuestion(index) {
    const q = questions[index];
    questionText.textContent = q.question;
    codeBlock.textContent = q.code;
    answered = false;
    answerInput.value = '';
    answerInput.disabled = false;
    feedbackMsg.textContent = '';
    feedbackMsg.className = 'feedback';
    correctAnswer = q.answer.trim();
    questionCounter.textContent = `question ${index + 1} / ${questions.length}`;
    submitBtn.textContent = 'submit ⏎';
    answerInput.focus();
  }

  function handleSubmit() {
    if (answered) return;

    const userAnswer = answerInput.value.trim();
    if (userAnswer === '') {
      feedbackMsg.textContent = '⌨️ type something first';
      feedbackMsg.className = 'feedback wrong';
      return;
    }

    const isCorrect = (userAnswer === correctAnswer);
    answeredCount++;

    if (isCorrect) {
      score++;
      updateScoreDisplay();
      feedbackMsg.textContent = '✓ correct!';
      feedbackMsg.className = 'feedback correct';
    } else {
      feedbackMsg.textContent = `✗ wrong. correct answer: "${correctAnswer}"`;
      feedbackMsg.className = 'feedback wrong';
    }

    answered = true;
    answerInput.disabled = true;

    if (currentQIndex === questions.length - 1) {
      submitBtn.textContent = 'finish ⏎';
    } else {
      submitBtn.textContent = 'next →';
    }
    submitBtn.focus();
  }

  function goToNext() {
    if (currentQIndex < questions.length - 1) {
      currentQIndex++;
      loadQuestion(currentQIndex);
    } else {
      showResults(false);
    }
  }

  function endQuizEarly() {
    if (currentQIndex === questions.length - 1 && answered) {
      showResults(false);
      return;
    }
    showResults(true);
  }

  function showResults(endedEarly) {
    quizEndedEarly = endedEarly;
    switchScreen('resultScreen');

    const total = questions.length;
    const attempted = answeredCount;

    if (endedEarly) {
      finalScore.textContent = `${score}/${attempted}`;
    } else {
      finalScore.textContent = `${score}/${total}`;
    }

    let msg = '';
    if (attempted === 0) {
      msg = '🤔 you didn\'t answer any questions.';
    } else {
      const pct = (score / attempted) * 100;
      if (pct === 100) msg = '🏆 perfect! arrays are your friend.';
      else if (pct >= 80) msg = '🔥 solid! just a bit more polish.';
      else if (pct >= 60) msg = '📘 not bad — review array indexing.';
      else if (pct >= 40) msg = '🧠 keep practicing, you\'ll get there.';
      else msg = '💻 time to revisit the basics — you got this.';
      if (endedEarly) {
        msg += ` (ended early — ${attempted} attempted)`;
      }
    }
    resultMessage.textContent = msg;
  }

  // ---------- event listeners ----------
  startBtn.addEventListener('click', () => {
    resetQuiz();
    switchScreen('quizScreen');
    loadQuestion(0);
  });

  submitBtn.addEventListener('click', () => {
    if (!answered) {
      handleSubmit();
    } else {
      goToNext();
    }
  });

  endQuizBtn.addEventListener('click', () => {
    endQuizEarly();
  });

  answerInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!answered) {
        handleSubmit();
      }
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && quizScreen.classList.contains('active')) {
      e.preventDefault();
      if (!answered) {
        handleSubmit();
      } else {
        goToNext();
      }
    }
  });

  restartBtn.addEventListener('click', () => {
    resetQuiz();
    switchScreen('startScreen');
  });

  submitBtn.textContent = 'submit ⏎';
  endQuizBtn.disabled = false;
</script>
</body>
</html>
