<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C Pointer Master Challenge</title>

<style>

body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:#0d1117;
    color:white;
}

header{
    background:#161b22;
    padding:20px;
    text-align:center;
    border-bottom:3px solid #58a6ff;
}

h1{
    margin:0;
    color:#58a6ff;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#161b22;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.question{
    font-size:1.4em;
    margin-bottom:25px;
}

.option{
    background:#21262d;
    padding:15px;
    margin:12px 0;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
    border:2px solid transparent;
}

.option:hover{
    transform:translateX(5px);
    border-color:#58a6ff;
}

.correct{
    background:#238636 !important;
}

.wrong{
    background:#da3633 !important;
}

button{
    background:#58a6ff;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

.progress{
    width:100%;
    background:#21262d;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress-bar{
    height:20px;
    background:#58a6ff;
    width:0%;
}

#feedback{
    font-size:1.3em;
    margin:20px 0;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    border-radius:8px;
    border:none;
}

.hidden{
    display:none;
}

.score{
    font-size:2.5em;
    color:#58a6ff;
}

</style>
</head>

<body>

<header>
<h1>🚀 C Pointer Master Challenge</h1>
<p>Advanced Programming</p>
</header>

<div class="container">

<div id="startScreen" class="card">

<h2>Welcome</h2>

<br>

<input type="text" id="studentName"
placeholder="Enter your name">

<br><br>

<center>
<button onclick="startQuiz()">
Start Quiz
</button>
</center>

</div>

<div id="quizScreen" class="hidden">

<div class="progress">
<div class="progress-bar"
id="progressBar"></div>
</div>

<p>
Question:
<span id="qNum"></span>/20
</p>

<p>
Score:
<span id="score">0</span>
</p>

<br>

<div class="card">

<div class="question"
id="questionText"></div>

<div id="options"></div>

<div id="feedback"></div>

<br>

<button
id="nextBtn"
class="hidden"
onclick="nextQuestion()">
Next Question
</button>

</div>

</div>

<div id="resultScreen"
class="hidden">

<div class="card">

<h1>Quiz Complete</h1>

<br>

<h2 id="student"></h2>

<p class="score">
<span id="finalScore"></span>
</p>

<p id="percentage"></p>

<h2 id="grade"></h2>

<h3 id="badge"></h3>

<br>

<button onclick="location.reload()">
Try Again
</button>

</div>

</div>

</div>

<script>

const questions = [

{
q:"Which of the following best describes a pointer?",
a:["A variable that stores a character",
"A variable that stores a memory address",
"A variable that stores multiple values",
"A variable that stores only integers"],
c:1
},
{
q:"Which statement correctly declares a pointer to an integer?",
a:["int p;","pointer p;","int *p;","*int p;"],
c:2
},
{
q:"Which operator is used to obtain the address of a variable?",
a:["*","%","&","#"],
c:2
},
{
q:"What is stored in p after int *p = &x ?",
a:["10",
"x multiplied by 2",
"Address of x",
"Undefined"],
c:2
},
{
q:"What is the value of *p if x = 15 and p points to x?",
a:["Address of x","15","0","Error"],
c:1
},
{
q:"What does printf('%p',p) display?",
a:["20","0","Address stored in p","Error"],
c:2
},
{
q:"If *p = 12 and p points to x?",
a:["x becomes 12",
"p becomes 12",
"x unchanged",
"Error"],
c:0
},
{
q:"Safest initialization for an unused pointer?",
a:["int *p;",
"int *p = NULL;",
"int p = NULL;",
"int *p = 1;"],
c:1
},
{
q:"What is wrong with int *p; *p=50;",
a:["Syntax Error",
"Pointer uninitialized",
"No integer assignment",
"NULL issue"],
c:1
},
{
q:"Correct way to store address of x in p?",
a:["p=x;",
"*p=x;",
"p=&x;",
"&p=x;"],
c:2
},
{
q:"Pointer arithmetic is often used for:",
a:["Multiplying addresses",
"Array access",
"String conversion",
"Sorting"],
c:1
},
{
q:"What is *(p+1) for {10,20,30}?",
a:["10","20","30","Address"],
c:1
},
{
q:"In most expressions an array name represents:",
a:["Size",
"Last element",
"Address of first element",
"Bytes"],
c:2
},
{
q:"What is *p when p = arr and arr={1,2,3}?",
a:["1","2","3","Address"],
c:0
},
{
q:"Which parameter allows modification of original variable?",
a:["int x",
"float x",
"char x",
"int *x"],
c:3
},
{
q:"After change(&x) sets *p=50, x becomes?",
a:["10","50","Address","Error"],
c:1
},
{
q:"What is a pointer to a pointer?",
a:["Two addresses",
"Address of another pointer",
"Array pointer",
"Character pointer"],
c:1
},
{
q:"If **pp is used, what is obtained?",
a:["Address of x",
"Address of p",
"Value stored in x",
"Error"],
c:2
},
{
q:"Pointer to pointer declaration?",
a:["int p;",
"int *p;",
"int **p;",
"int ***p;"],
c:2
},
{
q:"Output of printf('%d %d',x,*p) when p=&x and x=25?",
a:["25 25",
"Address Address",
"25 Address",
"Error"],
c:0
}

];

let current=0;
let score=0;

function startQuiz(){

let name=
document.getElementById("studentName")
.value;

if(name===""){
alert("Enter your name");
return;
}

document.getElementById("startScreen")
.classList.add("hidden");

document.getElementById("quizScreen")
.classList.remove("hidden");

showQuestion();

}

function showQuestion(){

let q=questions[current];

document.getElementById("qNum")
.innerText=current+1;

let progress=
((current)/questions.length)*100;

document.getElementById("progressBar")
.style.width=progress+"%";

document.getElementById("questionText")
.innerText=q.q;

let optionsHTML="";

q.a.forEach((option,index)=>{

optionsHTML+=`
<div class="option"
onclick="checkAnswer(${index})">
${option}
</div>
`;

});

document.getElementById("options")
.innerHTML=optionsHTML;

document.getElementById("feedback")
.innerHTML="";

document.getElementById("nextBtn")
.classList.add("hidden");

}

function checkAnswer(choice){

const q=questions[current];

let options=
document.querySelectorAll(".option");

options.forEach(x=>x.style.pointerEvents="none");

if(choice===q.c){

options[choice]
.classList.add("correct");

document.getElementById("feedback")
.innerHTML=
"✅ Correct!";

score++;

document.getElementById("score")
.innerText=score;

}
else{

options[choice]
.classList.add("wrong");

options[q.c]
.classList.add("correct");

document.getElementById("feedback")
.innerHTML=
"❌ Incorrect";

}

document.getElementById("nextBtn")
.classList.remove("hidden");

}

function nextQuestion(){

current++;

if(current<questions.length){

showQuestion();

}
else{

showResults();

}

}

function showResults(){

document.getElementById("quizScreen")
.classList.add("hidden");

document.getElementById("resultScreen")
.classList.remove("hidden");

let percent=
Math.round(
(score/questions.length)*100
);

let grade="F";

if(percent>=80) grade="A";
else if(percent>=70) grade="B";
else if(percent>=60) grade="C";
else if(percent>=50) grade="D";

let badge="📚 Keep Practising";

if(score>=18)
badge="🏆 Pointer Guru";
else if(score>=15)
badge="🎓 Memory Master";
else if(score>=10)
badge="💻 Pointer Apprentice";

document.getElementById("student")
.innerText=
document.getElementById("studentName")
.value;

document.getElementById("finalScore")
.innerText=
score+" / "+questions.length;

document.getElementById("percentage")
.innerText=
"Percentage: "+percent+"%";

document.getElementById("grade")
.innerText=
"Grade: "+grade;

document.getElementById("badge")
.innerText=badge;

}

</script>

</body>
</html>
