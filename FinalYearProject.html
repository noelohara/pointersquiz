<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Year Games Project · Login Test</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f3e8ff; padding: 2rem; }
    .box { max-width: 400px; margin: 5rem auto; background: white; padding: 2rem;
           border-radius: 20px; box-shadow: 0 20px 40px rgba(76,29,149,0.15); text-align: center; }
    h2 { color: #4c1d95; margin-bottom: 1rem; }
    input { width: 100%; padding: 1rem; border: 1.5px solid #cbd5e1;
            border-radius: 60px; font-size: 1rem; margin-bottom: 1rem; text-align: center; }
    button { width: 100%; padding: 1rem; background: #6b21a8; color: white;
             border: none; border-radius: 60px; font-size: 1rem;
             font-weight: 600; cursor: pointer; }
    button:hover { background: #4c1d95; }
    .err { color: #b91c1c; margin-top: 1rem; min-height: 1.5rem; font-weight: 500; }
    .ok { color: #15803d; margin-top: 1rem; font-weight: 500; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Login Test</h2>
    <input type="text" id="studentNumber" placeholder="Student number (e.g. c00295678)">
    <input type="password" id="userPassword" placeholder="Password (123456)">
    <button id="loginBtn">Log in</button>
    <div class="err" id="loginError"></div>
    <div class="ok" id="loginOk"></div>
  </div>

  <script>
    // ============================================================
    //  CONFIG
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAFX4zlwK_VGEFbvdTV0FObiIFa2lmWF2I",
      authDomain: "ai-project-tool.firebaseapp.com",
      databaseURL: "https://ai-project-tool-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ai-project-tool",
      storageBucket: "ai-project-tool.firebasestorage.app",
      messagingSenderId: "658331100512",
      appId: "1:658331100512:web:72208dc0c1561b95bcaa05"
    };

    // Check that Firebase loaded
    if (typeof firebase === 'undefined') {
      document.getElementById('loginError').textContent =
        '❌ Firebase SDK did not load. Check your internet / ad blocker.';
      throw new Error('Firebase SDK missing');
    }

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    console.log('✅ Firebase initialized');

    // ============================================================
    //  LOGIN
    // ============================================================
    const studentNumberInput = document.getElementById('studentNumber');
    const userPasswordInput = document.getElementById('userPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const loginOk = document.getElementById('loginOk');

    loginBtn.addEventListener('click', async () => {
      loginError.textContent = '';
      loginOk.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Checking…';

      const num = studentNumberInput.value.trim().toLowerCase();
      const pwd = userPasswordInput.value.trim();

      if (!num || !pwd) {
        loginError.textContent = 'Please fill in both fields.';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log in';
        return;
      }

      try {
        console.log('Looking up student:', num);

        // Search all groups for a matching student1
        const snap = await db.ref('groups').once('value');
        const groups = snap.val() || {};
        console.log('Total groups in DB:', Object.keys(groups).length);

        let match = null;
        for (const [groupId, g] of Object.entries(groups)) {
          const s1 = (g.student1 || '').toLowerCase();
          const s2 = (g.student2 || '').toLowerCase();
          if (s1 === num || s2 === num) {
            console.log('Found matching group:', groupId, 'class:', g.class);
            if (g.password === pwd) {
              match = { groupId, ...g };
              break;
            } else {
              console.log('  → password mismatch. Stored:', g.password);
            }
          }
        }

        if (!match) {
          loginError.textContent = '❌ Student number not found, or wrong password.';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log in';
          return;
        }

        loginOk.textContent = '✅ Login OK! Welcome ' + (match.student1Name || match.student1);
        console.log('Login success:', match);

      } catch (e) {
        console.error('Login error:', e);
        loginError.textContent = '❌ ' + e.message;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
