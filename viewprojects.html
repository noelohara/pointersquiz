<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects Overview · Admin</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(145deg, #eef2f7 0%, #dde6f0 100%);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      color: #1f2a3a;
    }
    .container { max-width: 1500px; margin: 0 auto; }

    /* LOGIN */
    #loginView {
      max-width: 420px; margin: 6rem auto; text-align: center;
      background: white; padding: 2.5rem 2rem; border-radius: 24px;
      box-shadow: 0 20px 40px -12px rgba(0,30,60,0.18);
    }
    #loginView .lock-icon { font-size: 3rem; margin-bottom: 1rem; }
    #loginView h2 { color: #0b2b4f; margin-bottom: 0.5rem; font-size: 1.5rem; }
    #loginView p { color: #5b7b9c; font-size: 0.9rem; margin-bottom: 1.5rem; }
    input[type="password"] {
      width: 100%; padding: 1rem 1.3rem; border-radius: 60px;
      border: 1.5px solid #cbd5e1; font-size: 1rem; font-family: inherit;
      outline: none; text-align: center; letter-spacing: 3px;
    }
    input[type="password"]:focus { border-color: #1e4c7a; box-shadow: 0 0 0 3px rgba(30,76,122,0.15); }

    .btn {
      background: #1e4c7a; color: white; font-weight: 600;
      border: none; padding: 0.95rem 2rem; border-radius: 60px;
      font-size: 1rem; cursor: pointer; font-family: inherit;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 8px 16px -4px rgba(20,60,110,0.3);
    }
    .btn:hover { background: #123a5e; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; pointer-events: none; }
    .btn-secondary { background: #e2e8f0; color: #1e2e44; box-shadow: none; }
    .btn-secondary:hover { background: #cfdae6; }
    .btn-sm { padding: 0.5rem 1.1rem; font-size: 0.85rem; }

    #loginView .btn { width: 100%; margin-top: 1rem; }
    .error-msg { color: #b91c1c; margin-top: 1rem; font-size: 0.9rem;
      min-height: 1.2rem; font-weight: 500; }

    /* HEADER */
    header.page-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.2rem; flex-wrap: wrap; gap: 1rem;
    }
    header.page-head h1 { font-size: 2rem; color: #0b2b4f; font-weight: 700; }
    header.page-head p { color: #5b7b9c; font-size: 0.95rem; margin-top: 0.2rem; }

    /* CLASS TABS */
    .class-tabs-wrap { display: flex; justify-content: center; margin-bottom: 1.5rem; }
    .class-tabs {
      display: flex; gap: 0.5rem;
      background: white; padding: 0.5rem; border-radius: 60px;
      box-shadow: 0 8px 20px -8px rgba(0,20,40,0.15);
      width: fit-content;
    }
    .class-tab {
      padding: 0.8rem 2rem; border-radius: 60px; font-weight: 700;
      cursor: pointer; border: none; background: transparent;
      color: #5b7b9c; font-family: inherit; font-size: 1rem;
      transition: all 0.18s;
      display: flex; align-items: center; gap: 0.5rem;
      white-space: nowrap;
    }
    .class-tab:hover:not(.active) { color: #0b2b4f; background: #f0f4f9; }
    .class-tab.active {
      background: #1e4c7a; color: white;
      box-shadow: 0 6px 14px -2px rgba(20,60,110,0.4);
    }
    .class-tab .tab-count {
      background: rgba(255,255,255,0.25); color: white;
      font-size: 0.72rem; padding: 0.15rem 0.55rem;
      border-radius: 20px; font-weight: 700; margin-left: 0.3rem;
    }
    .class-tab:not(.active) .tab-count { background: #e9f0f7; color: #5b7b9c; }

    /* CAROUSEL */
    .carousel-section {
      background: #0b2b4f; border-radius: 24px; padding: 1.2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 20px 40px -14px rgba(20,60,110,0.4);
      color: white;
    }
    .carousel-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.9rem; flex-wrap: wrap; gap: 0.6rem;
    }
    .carousel-title { font-size: 1.05rem; font-weight: 700;
      display: flex; align-items: center; gap: 0.5rem; }
    .carousel-title .live-dot {
      width: 9px; height: 9px; background: #22c55e; border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

    .carousel-viewport {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      background: #05172b; border-radius: 16px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .carousel-viewport video {
      width: 100%; height: 100%; border: 0; background: #000; object-fit: contain;
    }
    .carousel-viewport .placeholder {
      text-align: center; color: #8ba0b8; padding: 2rem; max-width: 560px;
    }
    .carousel-viewport .placeholder .icon { font-size: 4rem; margin-bottom: 1rem; }
    .carousel-viewport .placeholder a.open-btn {
      display: inline-block; background: #1f7a3e; color: white;
      padding: 0.7rem 1.6rem; border-radius: 30px; font-weight: 700;
      text-decoration: none; margin-top: 1rem;
    }
    .carousel-viewport .placeholder a.open-btn:hover { background: #155c2d; }

    .carousel-info {
      margin-top: 0.8rem; display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 0.6rem;
    }
    .carousel-info-left { min-width: 0; flex: 1 1 300px; }
    .carousel-project {
      font-size: 1.15rem; font-weight: 700; line-height: 1.2;
      color: white; word-break: break-word;
    }
    .carousel-meta { font-size: 0.82rem; color: #b0c5dc; margin-top: 0.2rem; }
    .carousel-counter {
      background: rgba(255,255,255,0.12); padding: 0.25rem 0.8rem;
      border-radius: 30px; font-size: 0.8rem; font-weight: 700; color: #b0c5dc;
    }

    .carousel-controls {
      display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.9rem;
      align-items: center;
    }
    .carousel-controls button {
      background: rgba(255,255,255,0.12); color: white; border: none;
      padding: 0.55rem 1.1rem; border-radius: 30px; cursor: pointer;
      font-family: inherit; font-size: 0.85rem; font-weight: 600;
      transition: background 0.15s;
      display: inline-flex; align-items: center; gap: 0.35rem;
    }
    .carousel-controls button:hover { background: rgba(255,255,255,0.22); }
    .carousel-controls button:disabled { opacity: 0.35; pointer-events: none; }
    .carousel-controls button.active { background: #1f7a3e; }
    .carousel-progress {
      flex: 1 1 100px; height: 4px; background: rgba(255,255,255,0.15);
      border-radius: 4px; overflow: hidden; min-width: 100px;
    }
    .carousel-progress-bar {
      height: 100%; background: #22c55e; width: 0%; transition: width 0.3s linear;
    }
    .carousel-dots {
      display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap;
      justify-content: flex-end;
    }
    .carousel-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.25); cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    .carousel-dot.active { background: #22c55e; transform: scale(1.4); }
    .carousel-dot:hover { background: rgba(255,255,255,0.5); }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
      gap: 1.2rem;
    }
    @media (max-width: 1000px) { .projects-grid { grid-template-columns: 1fr; } }

    .project-card {
      background: white; border-radius: 22px; padding: 1.5rem;
      box-shadow: 0 10px 26px -14px rgba(0,30,60,0.15);
      border: 1px solid #eef2f7;
      display: flex; flex-direction: column;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .project-card:hover {
      box-shadow: 0 20px 34px -14px rgba(0,30,60,0.22);
      transform: translateY(-2px);
    }
    .pc-head {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 0.7rem;
      margin-bottom: 0.7rem; flex-wrap: wrap;
    }
    .pc-title {
      font-size: 1.15rem; font-weight: 700; color: #0b2b4f;
      line-height: 1.25; flex: 1 1 200px; min-width: 0;

    .pc-badges { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .pill {

      letter-spacing: 0.4px;

    .pill-gameplay { background: #fef3c7; color: #92400e; }
    .pill-cat { background: #e9f0f7; color: #3d5b7a; }

    .pc-student {

    .pc-student .name {
      font-size: 0.92rem; font-weight: 700; color: #0b2b4f;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .pc-student .email {
      font-family: 'Courier New', monospace; font-weight: 600;
      color: #5b7b9c; font-size: 0.8rem;
      padding-left: 1.4rem;

    /* SECTIONS */
    .pc-section { margin-bottom: 1.2rem; }
    .pc-section:last-child { margin-bottom: 0; }
    .pc-section-title {
      font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.6px;
      color: #5b7b9c; margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.4rem;

    .pc-section-title .count {
      background: #e9f0f7; color: #5b7b9c; padding: 0.1rem 0.55rem;
      border-radius: 20px; font-size: 0.7rem; font-weight: 700;

      background: #fbfdff;
      border: 1.5px solid #dbeafe;
      border-radius: 14px;
      padding: 0.9rem 1rem;
      margin-bottom: 1rem;
    }
    .student-journal:last-child { margin-bottom: 0; }
    .student-journal-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 0.6rem; margin-bottom: 0.6rem; flex-wrap: wrap;
    }
    .student-name-block {
      display: flex; flex-direction: column; gap: 0.15rem;
      min-width: 0; flex: 1;
    }
    .student-name-line {
      font-weight: 700; color: #0b2b4f; font-size: 0.92rem;
      display: flex; align-items: center; gap: 0.4rem;
      word-break: break-word;
    }
    .student-email-line {
      font-family: 'Courier New', monospace; font-weight: 600;
      color: #5b7b9c; font-size: 0.78rem;
      padding-left: 1.35rem;
      word-break: break-all;

    .student-journal-count {
      font-size: 0.72rem; font-weight: 700;
      background: #e9f0f7; color: #3d5b7a;
      padding: 0.2rem 0.6rem; border-radius: 20px;
      flex-shrink: 0;
    }
    .student-journal-count.zero {
      background: #fee2e2; color: #b91c1c;
    }

    /* MINI CALENDAR */
    .cal-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 0.4rem;
    }
    .cal-month { font-size: 0.85rem; font-weight: 700; color: #1e2e44; }
    .cal-nav { display: flex; gap: 0.3rem; }
    .cal-nav button {
      background: #eef2f7; border: none; padding: 0.2rem 0.55rem;
      border-radius: 20px; cursor: pointer; font-weight: 700;
      font-family: inherit; font-size: 0.7rem; color: #1e2e44;
      transition: background 0.15s;
    }
    .cal-nav button:hover { background: #dde6f0; }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 2px; background: #f1f5f9; border-radius: 10px; padding: 4px;
    }
    .cal-head {
      text-align: center; font-size: 0.6rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.4px;
      color: #94a3b8; padding: 0.25rem 0;
    }
    .cal-day {
      background: white; border-radius: 6px;
      min-height: 36px; padding: 0.25rem 0.15rem;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      font-size: 0.7rem; color: #1f2a3a;
      border: 1.5px solid transparent;
      position: relative;
    }
    .cal-day.empty-day { background: #f8fafc; opacity: 0.3; }
    .cal-day.today { border-color: #f59e0b; background: #fffbeb; }
    .cal-day .cal-num { font-weight: 600; font-size: 0.68rem; line-height: 1; }

    .cal-dots {
      display: flex; gap: 2px; margin-top: 2px;
      flex-wrap: wrap; justify-content: center;
    }
    .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
    .cal-dot.sc { background: #1f7a3e; }
    .cal-dot.jn { background: #1e4c7a; }

    .cal-legend {
      display: flex; gap: 0.8rem; margin-top: 0.4rem;
      font-size: 0.68rem; color: #64748b; flex-wrap: wrap;
    }
    .cal-legend-item { display: flex; align-items: center; gap: 0.25rem; }
    .cal-legend-swatch { width: 8px; height: 8px; border-radius: 50%; }
    .cal-legend-swatch.sc { background: #1f7a3e; }
    .cal-legend-swatch.jn { background: #1e4c7a; }
    .cal-legend-swatch.today { background: #fffbeb; border: 1.5px solid #f59e0b; }

    .links-strip {
      display: flex; flex-direction: column; gap: 0.3rem;
      margin-top: 0.6rem;
    }
    .link-row {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.8rem; padding: 0.35rem 0.55rem;
      background: white; border-radius: 10px;
      border-left: 3px solid #1f7a3e;
      text-decoration: none; color: #1e2e44;
      transition: background 0.15s;
    }
    .link-row.jn { border-left-color: #1e4c7a; }
    .link-row:hover { background: #eef2f7; }
    .link-row .date {
      font-size: 0.65rem; color: #94a3b8; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.3px; flex-shrink: 0;
      min-width: 42px;
    }
    .link-row .title {
      font-weight: 600; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .link-row .open { color: #1e4c7a; font-weight: 700; flex-shrink: 0; font-size: 0.75rem; }

    .links-none {
      color: #94a3b8; font-size: 0.78rem; font-style: italic;
      text-align: center; padding: 0.35rem;
    }
    .links-none.missing {
      color: #b91c1c; font-weight: 600; font-style: normal;
    }

    .gh-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: #0b2b4f; color: white; text-decoration: none;
      padding: 0.5rem 1rem; border-radius: 30px;
      font-size: 0.82rem; font-weight: 600;
      transition: background 0.15s;
    }
    .gh-btn:hover { background: #123a5e; }
    .gh-none { color: #8ba0b8; font-size: 0.82rem; font-style: italic; }

    .empty-state {
      background: white; border-radius: 22px; padding: 4rem 2rem;
      text-align: center; color: #5b7b9c;
      box-shadow: 0 10px 26px -14px rgba(0,30,60,0.1);
    }
    .empty-state .icon { font-size: 4rem; margin-bottom: 1rem; }

    .hidden { display: none !important; }

    .video-source-badge {
      position: absolute; top: 10px; right: 10px;
      background: rgba(0,0,0,0.55); color: white;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      padding: 0.25rem 0.6rem; border-radius: 20px;
      letter-spacing: 0.4px; pointer-events: none;
    }
    .carousel-viewport { position: relative; }
  </style>
</head>

      <div class="class-tabs" id="classTabs">
        <button class="class-tab active" data-class="gameplay">

        <button class="class-tab" data-class="advanced">

    <div id="projectsGrid" class="projects-grid">
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="icon">⏳</div>

      </div>

</div>

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)]
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

const MONTH_NAMES_LONG = ['January','February','March','April','May','June',
                          'July','August','September','October','November','December'];

// ═══════════════════════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════════════════════
function checkAuth() {
  if (sessionStorage.getItem('overview_admin_auth') === 'true') showDashboard();
}

loginBtn.addEventListener('click', doLogin);
passwordInput.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  if (!passwordInput.value) {
    loginError.textContent = 'Please enter a password.';
    return;
  }

  loginBtn.disabled = true;
  const originalText = loginBtn.textContent;
  loginBtn.textContent = 'Checking…';
  loginError.textContent = '';

  try {
    const enteredHash = await sha256Hex(passwordInput.value);
    if (enteredHash === ADMIN_PASSWORD_HASH) {
      sessionStorage.setItem('overview_admin_auth', 'true');
      loginError.textContent = '';
      showDashboard();
    } else {
      loginError.textContent = '❌ Incorrect password.';
      passwordInput.value = '';
      passwordInput.focus();
    }
  } catch (e) {
    loginError.textContent = '⚠️ Browser error: ' + e.message + ' (HTTPS required)';
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = originalText;
  }
}

logoutBtn.addEventListener('click', () => {
  sessionStorage.removeItem('overview_admin_auth');
  stopAllTimers();
  dashboardView.classList.add('hidden');
  loginView.classList.remove('hidden');
  passwordInput.value = '';
  passwordInput.focus();
});

function showDashboard() {
  loginView.classList.add('hidden');
  dashboardView.classList.remove('hidden');

  const saved = sessionStorage.getItem('overview_current_class');
  if (saved && CLASSES[saved]) currentClass = saved;
  updateActiveTab();

  loadEverything();
}

// ═══════════════════════════════════════════════════════════
//  CLASS TABS
// ═══════════════════════════════════════════════════════════
classTabs.querySelectorAll('.class-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    if (tab.dataset.class === currentClass) return;
    currentClass = tab.dataset.class;
    sessionStorage.setItem('overview_current_class', currentClass);
    updateActiveTab();
    applyClassFilter();
    buildFeaturedReels();
    renderProjectsGrid();
    startCarousel();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

function updateActiveTab() {
  classTabs.querySelectorAll('.class-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.class === currentClass);
  });
}

// ═══════════════════════════════════════════════════════════
//  DATA LOADING
// ═══════════════════════════════════════════════════════════
async function loadEverything() {
  try {
    const [studentsSnap, groupsSnap, gpProjects, gpSel, advProjects, advSel] = await Promise.all([
      db.ref('students').once('value'),
      db.ref('groups').once('value'),
      db.ref('classes/gameplay/projects').once('value'),
      db.ref('classes/gameplay/selections').once('value'),
      db.ref('classes/advanced/projects').once('value'),
      db.ref('classes/advanced/selections').once('value')
    ]);

    studentsData = studentsSnap.val() || {};
    groupsData = groupsSnap.val() || {};

    const gp = gpProjects.val() || {};
    const gpS = gpSel.val() || {};
    const adv = advProjects.val() || {};
    const advS = advSel.val() || {};

    allProjectsRaw = [];

    Object.entries(gpS).forEach(([pid, sel]) => {
      const proj = gp[pid] || { name: pid, category: '—' };
      allProjectsRaw.push({
        projectId: pid,
        projectName: proj.name,
        category: proj.category || 'General',
        classId: 'gameplay',
        className: CLASSES.gameplay.name,
        selection: sel,
        group: groupsData[sel.groupId] || {}
      });
    });

    Object.entries(advS).forEach(([pid, sel]) => {
      const proj = adv[pid] || { name: pid, category: '—' };
      allProjectsRaw.push({
        projectId: pid,
        projectName: proj.name,
        category: proj.category || 'General',
        classId: 'advanced',
        className: CLASSES.advanced.name,
        selection: sel,
        group: groupsData[sel.groupId] || {}
      });
    });

    updateTabCounts();
    applyClassFilter();
    buildFeaturedReels();
    renderProjectsGrid();
    startCarousel();

  } catch (e) {
    console.error('Load error:', e);
    projectsGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <div class="icon">❌</div>
      <div>Failed to load: ${escapeHtml(e.message)}</div>
    </div>`;
  }
}

function updateTabCounts() {
  tabCountGp.textContent = allProjectsRaw.filter(p => p.classId === 'gameplay').length;
  tabCountAdv.textContent = allProjectsRaw.filter(p => p.classId === 'advanced').length;
}

function applyClassFilter() {
  allProjects = allProjectsRaw.filter(p => p.classId === currentClass);
}

// ═══════════════════════════════════════════════════════════
//  STUDENT NAME LOOKUP
//  Look up a student by number and return "First Last" or null.
// ═══════════════════════════════════════════════════════════
function lookupStudentName(studentNumber) {
  if (!studentNumber) return null;
  const key = String(studentNumber).trim().toLowerCase();
  const s = studentsData[key];
  if (!s) return null;
  const first = (s.firstName || '').trim();
  const last = (s.lastName || '').trim();
  if (!first && !last) return null;
  return (first + ' ' + last).trim();
}

// ═══════════════════════════════════════════════════════════
//  FEATURED REELS
// ═══════════════════════════════════════════════════════════
function buildFeaturedReels() {
  featuredReels = [];

  allProjects.forEach(p => {
    const scs = p.group.screencasts || {};
    const entries = Object.entries(scs);
    if (entries.length === 0) return;

    entries.sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));
    const latest = entries[0][1];

    featuredReels.push({
      url: latest.url,
      directUrl: oneDriveDirectUrl(latest.url),
      title: latest.title || 'Screencast',
      projectName: p.projectName,
      className: p.className,
      students: [p.selection.student1, p.selection.student2].filter(Boolean),
      timestamp: latest.timestamp
    });
  });

  featuredReels.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
}

// ═══════════════════════════════════════════════════════════
//  CAROUSEL
// ═══════════════════════════════════════════════════════════
function startCarousel() {
  stopAllTimers();
  currentSlide = 0;
  renderCarouselDots();

  if (featuredReels.length === 0) {
    carouselViewport.innerHTML = `
      <div class="placeholder">
        <div class="icon">📼</div>
        <div>No screencasts uploaded yet in ${escapeHtml(CLASSES[currentClass].name)}</div>
        <div style="font-size:0.85rem; margin-top:0.5rem; opacity:0.75;">
          Students need to upload at least one screencast for their project.
        </div>
      </div>`;
    carouselProject.textContent = '—';
    carouselMeta.textContent = 'Nothing to play';
    carouselCounter.textContent = '0 / 0';
    [prevBtn, nextBtn, playPauseBtn, muteBtn, fullscreenBtn].forEach(b => b.disabled = true);
    return;
  }

  [prevBtn, nextBtn, playPauseBtn, muteBtn, fullscreenBtn].forEach(b => b.disabled = false);
  showSlide(currentSlide);
}

function renderCarouselDots() {
  carouselDots.innerHTML = featuredReels.map((_, i) =>
    `<div class="carousel-dot${i === currentSlide ? ' active' : ''}" data-idx="${i}"></div>`
  ).join('');
  carouselDots.querySelectorAll('.carousel-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      gotoSlide(parseInt(dot.dataset.idx, 10));
    });
  });
}

function stopAllTimers() {
  if (slideFallbackTimer) { clearTimeout(slideFallbackTimer); slideFallbackTimer = null; }
  if (currentVideoEl) {
    try { currentVideoEl.pause(); } catch (e) {}
    currentVideoEl = null;
  }
}

function showSlide(idx) {
  if (featuredReels.length === 0) return;
  if (idx < 0) idx = featuredReels.length - 1;
  if (idx >= featuredReels.length) idx = 0;
  currentSlide = idx;

  stopAllTimers();

  const reel = featuredReels[idx];
  carouselCounter.textContent = (idx + 1) + ' / ' + featuredReels.length;
  carouselProject.textContent = reel.projectName;
  const studentList = reel.students.map(s => studentLabel(s)).join(' · ');
  carouselMeta.textContent = '🎬 ' + reel.title + '  •  ' + reel.className + '  •  ' + studentList;

  carouselDots.querySelectorAll('.carousel-dot').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
  });

  if (reel.directUrl) {
    buildVideoPlayer(reel);
  } else {
    buildFallbackCard(reel, 'no-stream', 'No direct stream URL could be built for this link.');
  }
}

function buildVideoPlayer(reel) {
  const sourceBadge = reel.directUrl.source
    ? `<div class="video-source-badge">${escapeHtml(reel.directUrl.source)}</div>`
    : '';

  carouselViewport.innerHTML = `
    ${sourceBadge}
    <video id="carouselVideo" controls playsinline preload="auto"
           muted="${isMuted}"
           style="width:100%; height:100%; background:#000; object-fit:contain;">
      <source src="${escapeHtml(reel.directUrl.url)}" type="video/mp4">
    </video>
  `;

  const video = document.getElementById('carouselVideo');
  if (!video) return;
  currentVideoEl = video;

  if (isPlaying) {
    video.play().catch(err => {
      console.warn('Autoplay blocked:', err);
      video.muted = true;
      isMuted = true;
      updateMuteButton();
    });
  }

  video.addEventListener('ended', () => {
    if (isPlaying) showSlide(currentSlide + 1);
  });

  video.addEventListener('error', () => {
    const err = video.error;
    let reason = 'unknown';
    if (err) {
      if (err.code === 1) reason = 'aborted';
      else if (err.code === 2) reason = 'network';
      else if (err.code === 3) reason = 'decode';
      else if (err.code === 4) reason = 'unsupported';
    }
    buildFallbackCard(reel, reason, 'The direct stream URL could not be played.');
  });

  video.addEventListener('timeupdate', () => {
    if (!video.duration || video.duration === Infinity) return;
    progressBar.style.width = ((video.currentTime / video.duration) * 100) + '%';
  });

  slideFallbackTimer = setTimeout(() => {
    if (video.readyState < 2) {
      buildFallbackCard(reel, 'stalled', 'The video did not start streaming in time.');
    }
  }, 4500);
}

function buildFallbackCard(reel, reason, message) {
  stopAllTimers();
  progressBar.style.width = '100%';

  carouselViewport.innerHTML = `
    <div class="placeholder">
      <div class="icon">🔒</div>
      <div style="font-weight:700; color:#93c5fd; font-size:1.05rem; margin-bottom:0.4rem;">
        Preview not available in-browser
      </div>
      <div style="font-size:0.88rem;">
        ${escapeHtml(message)}<br>
        <span style="opacity:0.75;">Reason: ${escapeHtml(reason)}</span>
      </div>
      <a class="open-btn" href="${escapeHtml(reel.url)}" target="_blank" rel="noopener">
        ▶ Open in OneDrive
      </a>
    </div>
  `;

  slideFallbackTimer = setTimeout(() => {
    if (isPlaying && featuredReels.length > 1) {
      showSlide(currentSlide + 1);
    }
  }, FALLBACK_DURATION);
}

function gotoSlide(idx) { showSlide(idx); }

prevBtn.addEventListener('click', () => showSlide(currentSlide - 1));
nextBtn.addEventListener('click', () => showSlide(currentSlide + 1));

playPauseBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  if (isPlaying) {
    playPauseBtn.textContent = '⏸ Pause';
    playPauseBtn.classList.add('active');
    if (currentVideoEl) currentVideoEl.play().catch(() => {});
    else showSlide(currentSlide);
  } else {
    playPauseBtn.textContent = '▶ Play';
    playPauseBtn.classList.remove('active');
    if (currentVideoEl) currentVideoEl.pause();
    stopAllTimers();
  }
});

muteBtn.addEventListener('click', () => {
  isMuted = !isMuted;
  if (currentVideoEl) currentVideoEl.muted = isMuted;
  updateMuteButton();
});

function updateMuteButton() {
  if (isMuted) {
    muteBtn.textContent = '🔇 Unmute';
    muteBtn.classList.remove('active');
  } else {
    muteBtn.textContent = '🔊 Mute';
    muteBtn.classList.add('active');
  }
}

fullscreenBtn.addEventListener('click', () => {
  const el = carouselViewport;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen) el.msRequestFullscreen();
});

// ═══════════════════════════════════════════════════════════
//  PROJECT GRID
// ═══════════════════════════════════════════════════════════
function renderProjectsGrid() {
  if (allProjects.length === 0) {
    projectsGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <div class="icon">📭</div>
      <div>No teams have registered yet in <strong>${escapeHtml(CLASSES[currentClass].name)}</strong>.</div>
    </div>`;
    return;
  }

  allProjects.sort((a, b) => a.projectName.localeCompare(b.projectName));

  projectsGrid.innerHTML = allProjects.map(p => renderProjectCard(p)).join('');
  renderCalendars();
}

function renderProjectCard(p) {
  const s1 = p.selection.student1 || '—';
  const s2 = p.selection.student2 || '—';
  const s1Lower = String(s1).trim().toLowerCase();
  const s2Lower = String(s2).trim().toLowerCase();

  const name1 = lookupStudentName(s1);
  const name2 = lookupStudentName(s2);
  const email1 = studentEmail(s1);
  const email2 = studentEmail(s2);

  const classPill = p.classId === 'advanced'
    ? '<span class="pill pill-advanced">💻 Advanced</span>'
    : '<span class="pill pill-gameplay">🎮 Gameplay</span>';

  const scs = p.group.screencasts || {};
  const scEntries = Object.entries(scs).sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));

  const journalsByStudent = p.group.journals || {};
  const j1 = journalsByStudent[s1Lower] || {};
  const j2 = journalsByStudent[s2Lower] || {};
  const j1Entries = Object.entries(j1).sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));
  const j2Entries = Object.entries(j2).sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));

  const calBase = p.classId + ':' + p.projectId;
  const scCalKey = calBase + ':sc';
  const j1CalKey = calBase + ':j1';
  const j2CalKey = calBase + ':j2';

  const now = new Date();
  if (!calState[scCalKey]) calState[scCalKey] = { year: now.getFullYear(), monthIdx: now.getMonth() };
  if (!calState[j1CalKey]) calState[j1CalKey] = { year: now.getFullYear(), monthIdx: now.getMonth() };
  if (!calState[j2CalKey]) calState[j2CalKey] = { year: now.getFullYear(), monthIdx: now.getMonth() };

  return `
    <div class="project-card">
      <div class="pc-head">
        <div class="pc-title">${escapeHtml(p.projectName)}</div>
        <div class="pc-badges">
          ${classPill}
          <span class="pill pill-cat">${escapeHtml(p.category)}</span>
        </div>
      </div>

      <div class="pc-team">
        <div class="pc-student">
          <div class="name">👤 ${name1 ? escapeHtml(name1) : '<span style="color:#8ba0b8;font-style:italic;font-weight:500;">(unknown student)</span>'}</div>
          <div class="email">${escapeHtml(email1)}</div>
        </div>
        <div class="pc-student">
          <div class="name">👤 ${name2 ? escapeHtml(name2) : '<span style="color:#8ba0b8;font-style:italic;font-weight:500;">(unknown student)</span>'}</div>
          <div class="email">${escapeHtml(email2)}</div>
        </div>
      </div>

      <!-- TEAM SCREENCASTS -->
      <div class="pc-section">
        <div class="pc-section-title">🎬 Team screencasts <span class="count">${scEntries.length}</span></div>
        <div class="cal-header">
          <div class="cal-month" id="${scCalKey}-label">—</div>
          <div class="cal-nav">
            <button onclick="calNav('${scCalKey}', -1)">←</button>
            <button onclick="calNav('${scCalKey}', 1)">→</button>
          </div>
        </div>
        <div class="cal-grid" id="${scCalKey}-grid"></div>
        <div class="cal-legend">
          <div class="cal-legend-item"><div class="cal-legend-swatch sc"></div>Screencast uploaded</div>
          <div class="cal-legend-item"><div class="cal-legend-swatch today"></div>Today</div>
        </div>
        <div class="links-strip">
          ${scEntries.length === 0
            ? '<div class="links-none">No screencasts yet</div>'
            : scEntries.slice(0, 3).map(([id, sc]) => linkRowSC(sc)).join('') +
              (scEntries.length > 3 ? `<div class="links-none" style="font-style:normal;">+${scEntries.length - 3} more in the calendar</div>` : '')
          }
        </div>
      </div>

      <!-- INDIVIDUAL JOURNALS -->
      <div class="pc-section">
        <div class="pc-section-title">📄 Individual journals</div>

        <!-- Student 1 -->
        <div class="student-journal">
          <div class="student-journal-head">
            <div class="student-name-block">
              <div class="student-name-line">👤 ${name1 ? escapeHtml(name1) : '<span style="color:#8ba0b8;font-style:italic;">(unknown student)</span>'}</div>
              <div class="student-email-line">${escapeHtml(email1)}</div>
            </div>
            <span class="student-journal-count ${j1Entries.length === 0 ? 'zero' : ''}">
              ${j1Entries.length} journal${j1Entries.length === 1 ? '' : 's'}
            </span>
          </div>
          <div class="cal-header">
            <div class="cal-month" id="${j1CalKey}-label">—</div>
            <div class="cal-nav">
              <button onclick="calNav('${j1CalKey}', -1)">←</button>
              <button onclick="calNav('${j1CalKey}', 1)">→</button>
            </div>
          </div>
          <div class="cal-grid" id="${j1CalKey}-grid"></div>
          <div class="links-strip">
            ${j1Entries.length === 0
              ? '<div class="links-none missing">⚠️ No journals submitted by this student</div>'
              : j1Entries.slice(0, 3).map(([id, jn]) => linkRowJN(jn)).join('') +
                (j1Entries.length > 3 ? `<div class="links-none" style="font-style:normal;">+${j1Entries.length - 3} more in the calendar</div>` : '')
            }
          </div>
        </div>

        <!-- Student 2 -->
        <div class="student-journal">
          <div class="student-journal-head">
            <div class="student-name-block">
              <div class="student-name-line">👤 ${name2 ? escapeHtml(name2) : '<span style="color:#8ba0b8;font-style:italic;">(unknown student)</span>'}</div>
              <div class="student-email-line">${escapeHtml(email2)}</div>
            </div>
            <span class="student-journal-count ${j2Entries.length === 0 ? 'zero' : ''}">
              ${j2Entries.length} journal${j2Entries.length === 1 ? '' : 's'}
            </span>
          </div>
          <div class="cal-header">
            <div class="cal-month" id="${j2CalKey}-label">—</div>
            <div class="cal-nav">
              <button onclick="calNav('${j2CalKey}', -1)">←</button>
              <button onclick="calNav('${j2CalKey}', 1)">→</button>
            </div>
          </div>
          <div class="cal-grid" id="${j2CalKey}-grid"></div>
          <div class="links-strip">
            ${j2Entries.length === 0
              ? '<div class="links-none missing">⚠️ No journals submitted by this student</div>'
              : j2Entries.slice(0, 3).map(([id, jn]) => linkRowJN(jn)).join('') +
                (j2Entries.length > 3 ? `<div class="links-none" style="font-style:normal;">+${j2Entries.length - 3} more in the calendar</div>` : '')
            }
          </div>
        </div>
      </div>

      <!-- GITHUB -->
      <div class="pc-section">
        <div class="pc-section-title">🐙 Repository</div>
        ${p.group.githubLink
          ? `<a class="gh-btn" href="${escapeHtml(p.group.githubLink)}" target="_blank">🐙 Open repository</a>`
          : '<div class="gh-none">No GitHub link set</div>'}
      </div>
    </div>
  `;
}

function linkRowSC(sc) {
  const d = sc.timestamp ? new Date(sc.timestamp) : null;
  const dateStr = d ? d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] : '—';
  return `
    <a class="link-row" href="${escapeHtml(sc.url)}" target="_blank" title="${escapeHtml(sc.title || '')}">
      <span class="date">${escapeHtml(dateStr)}</span>
      <span class="title">${escapeHtml(sc.title || 'Untitled')}</span>
      <span class="open">Open ↗</span>
    </a>
  `;
}

function linkRowJN(jn) {
  const d = jn.timestamp ? new Date(jn.timestamp) : null;
  const dateStr = d ? d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] : '—';
  return `
    <a class="link-row jn" href="${escapeHtml(jn.url)}" target="_blank" title="${escapeHtml(jn.title || '')}">
      <span class="date">${escapeHtml(dateStr)}</span>
      <span class="title">${escapeHtml(jn.title || 'Journal')}</span>
      <span class="open">Open ↗</span>
    </a>
  `;
}

// ═══════════════════════════════════════════════════════════
//  CALENDAR RENDERING
// ═══════════════════════════════════════════════════════════
function renderCalendars() {
  allProjects.forEach(p => {
    const calBase = p.classId + ':' + p.projectId;
    const s1Lower = String(p.selection.student1 || '').trim().toLowerCase();
    const s2Lower = String(p.selection.student2 || '').trim().toLowerCase();

    const scItems = Object.values(p.group.screencasts || {});
    renderMiniCalendar(calBase + ':sc', scItems, 'sc');

    const j1Items = Object.values((p.group.journals || {})[s1Lower] || {});
    renderMiniCalendar(calBase + ':j1', j1Items, 'jn');

    const j2Items = Object.values((p.group.journals || {})[s2Lower] || {});
    renderMiniCalendar(calBase + ':j2', j2Items, 'jn');
  });
}

function renderMiniCalendar(calKey, items, dotClass) {
  const state = calState[calKey];
  if (!state) return;

  const label = document.getElementById(calKey + '-label');
  const grid = document.getElementById(calKey + '-grid');
  if (!label || !grid) return;

  label.textContent = MONTH_NAMES_LONG[state.monthIdx] + ' ' + state.year;

  const firstDay = new Date(state.year, state.monthIdx, 1);
  const daysInMonth = new Date(state.year, state.monthIdx + 1, 0).getDate();
  let startOffset = firstDay.getDay() - 1;
  if (startOffset < 0) startOffset = 6;

  const byDay = {};
  items.forEach(item => {
    if (!item.timestamp) return;
    const d = new Date(item.timestamp);
    if (d.getFullYear() !== state.year || d.getMonth() !== state.monthIdx) return;
    const day = d.getDate();
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(item);
  });

  const today = new Date();
  const isThisMonth = today.getFullYear() === state.year && today.getMonth() === state.monthIdx;
  const todayDay = today.getDate();

  let html = '';
  ['M','T','W','T','F','S','S'].forEach(d => {
    html += `<div class="cal-head">${d}</div>`;
  });
  for (let i = 0; i < startOffset; i++) {
    html += '<div class="cal-day empty-day"></div>';
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const classes = ['cal-day'];
    if (isThisMonth && d === todayDay) classes.push('today');
    const dayItems = byDay[d] || [];
    let dotsHtml = '';
    if (dayItems.length > 0) {
      dotsHtml = '<div class="cal-dots">';
      const shown = dayItems.slice(0, 3);
      shown.forEach(() => {
        dotsHtml += `<div class="cal-dot ${dotClass}"></div>`;
      });
      if (dayItems.length > 3) {
        dotsHtml += `<span style="font-size:0.55rem; color:#64748b; font-weight:700;">+${dayItems.length - 3}</span>`;
      }
      dotsHtml += '</div>';
    }
    html += `<div class="${classes.join(' ')}" title="${dayItems.length ? dayItems.length + ' upload(s)' : ''}">
      <div class="cal-num">${d}</div>
      ${dotsHtml}
    </div>`;
  }
  grid.innerHTML = html;
}

window.calNav = function(calKey, delta) {
  const state = calState[calKey];
  if (!state) return;
  state.monthIdx += delta;
  if (state.monthIdx < 0) { state.monthIdx = 11; state.year--; }
  if (state.monthIdx > 11) { state.monthIdx = 0; state.year++; }

  const parts = calKey.split(':');
  const classId = parts[0];
  const projectId = parts[1];
  const type = parts[2];

  const p = allProjects.find(x => x.classId === classId && x.projectId === projectId);
  if (!p) return;

  const s1Lower = String(p.selection.student1 || '').trim().toLowerCase();
  const s2Lower = String(p.selection.student2 || '').trim().toLowerCase();

  if (type === 'sc') {
    const items = Object.values(p.group.screencasts || {});
    renderMiniCalendar(calKey, items, 'sc');
  } else if (type === 'j1') {
    const items = Object.values((p.group.journals || {})[s1Lower] || {});
    renderMiniCalendar(calKey, items, 'jn');
  } else if (type === 'j2') {
    const items = Object.values((p.group.journals || {})[s2Lower] || {});
    renderMiniCalendar(calKey, items, 'jn');
  }
};

// ═══════════════════════════════════════════════════════════
//  ONEDRIVE → DIRECT STREAM URL
// ═══════════════════════════════════════════════════════════
function oneDriveDirectUrl(url) {
  if (!url) return null;
  const raw = String(url).trim();
  if (!raw) return null;

  try {
    if (raw.includes('onedrive.live.com/download')) {
      return { url: raw, source: 'direct-download' };
    }
    if (raw.includes('onedrive.live.com')) {
      const u = new URL(raw);
      const resid = u.searchParams.get('resid');
      const authkey = u.searchParams.get('authkey') || '';
      if (resid) {
        return {
          url: `https://onedrive.live.com/download?resid=${encodeURIComponent(resid)}&authkey=${encodeURIComponent(authkey)}`,
          source: 'resid-download'
        };
      }
    }
    if (raw.includes('1drv.ms')) {
      const token = 'u!' + base64UrlEncode(raw);
      return { url: `https://api.onedrive.com/v1.0/shares/${token}/root/content`, source: 'api-share' };
    }
    if (raw.includes('sharepoint.com')) {
      const sep = raw.includes('?') ? '&' : '?';
      return { url: raw + sep + 'download=1', source: 'sharepoint-dl' };
    }
    if (/\.(mp4|webm|ogg|mov|m4v)(\?|$)/i.test(raw)) {
      return { url: raw, source: 'local-file' };
    }
    if (raw.includes('youtube.com') || raw.includes('youtu.be') || raw.includes('vimeo.com')) return null;
    const sep = raw.includes('?') ? '&' : '?';
    return { url: raw + sep + 'download=1', source: 'fallback-dl' };
  } catch (e) { return null; }
}

function base64UrlEncode(str) {
  try {
    const b64 = btoa(unescape(encodeURIComponent(str)));
    return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  } catch (e) { return ''; }
}

// ═══════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════
function studentEmail(num) {
  if (!num) return '—';
  const clean = String(num).trim();
  if (clean.includes('@')) return clean;
  return clean + '@setu.ie';
}

function studentLabel(num) {
  const name = lookupStudentName(num);
  return name ? name + ' (' + studentEmail(num) + ')' : studentEmail(num);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
