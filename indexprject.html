<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Selection · GESMA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #eef2f7 0%, #dde6f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #1f2a3a;
    }
    .wrapper { max-width: 900px; width: 100%; text-align: center; }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #0b2b4f;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .sub {
      color: #4f6b88;
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }
    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .class-card {
      background: white;
      border-radius: 24px;
      padding: 2.5rem 1.8rem;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 20px 40px -12px rgba(0,30,60,0.15);
      border: 2px solid transparent;
      transition: all 0.2s;
      display: block;
    }
    .class-card:hover {
      transform: translateY(-4px);
      border-color: #1e4c7a;
      box-shadow: 0 28px 50px -14px rgba(20,60,110,0.28);
    }
    .class-icon { font-size: 3.5rem; margin-bottom: 1rem; }
    .class-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0b2b4f;
      margin-bottom: 0.5rem;
    }
    .class-desc { color: #5b7b9c; font-size: 0.95rem; }
    .footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: #8ba0b8;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>📋 Project Selection</h1>
    <p class="sub">Choose your class to begin</p>

    <div class="class-grid">
      <a href="gameplay.html" class="class-card">
        <div class="class-icon">🎮</div>
        <div class="class-name">Gameplay</div>
        <div class="class-desc">Register your team and pick a project</div>
      </a>
      <a href="advanced.html" class="class-card">
        <div class="class-icon">💻</div>
        <div class="class-name">Advanced Programming</div>
        <div class="class-desc">Register your team and pick a project</div>
      </a>
    </div>

    <p class="footer">GESMA · <a href="admin.html" style="color:#5b7b9c;">Admin</a></p>
  </div>
</body>
</html>
