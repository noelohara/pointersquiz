<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gameplay · Project Selection</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(145deg, #f7f9fc 0%, #e9eef3 100%);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      color: #1f2a3a;
    }
    .container { max-width: 1300px; margin: 0 auto; }
    header {
      text-align: center;
      margin-bottom: 1.5rem;
      position: relative;
    }
    .back-link {
      position: absolute;
      left: 0;
      top: 0;
      color: #5b7b9c;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,20,40,0.06);
      transition: all 0.15s;
    }
    .back-link:hover { color: #0b2b4f; transform: translateX(-3px); }
    h1 { font-size: 2.2rem; color: #0b2b4f; letter-spacing: -0.02em; }
    .subtitle { color: #4f6b88; margin-top: 0.4rem; }

    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 1.8rem;
      box-shadow: 0 20px 35px -8px rgba(0,30,60,0.12);
      border: 1px solid rgba(255,255,255,0.7);
      margin-bottom: 1.5rem;
    }

    /* ---------- SELECTED PROJECT BANNER ---------- */
    .selected-banner {
      background: linear-gradient(135deg, #1e4c7a 0%, #2d5a8a 100%);
      color: white;
      border-radius: 22px;
      padding: 1.5rem 1.8rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.3rem;
      box-shadow: 0 12px 28px -8px rgba(20,60,110,0.45);
      position: relative;
      overflow: hidden;
    }
    .selected-banner::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 160px;
      height: 160px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .selected-banner.empty {
      background: #e8eef5;
      color: #5b7b9c;
      box-shadow: none;
    }
    .selected-banner.empty::after { display: none; }
    .selected-icon {
      font-size: 2.2rem;
      background: rgba(255,255,255,0.15);
      width: 60px;
      height: 60px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .selected-banner.empty .selected-icon {
      background: #d5e0ec;
      color: #8ba0b8;
    }
    .selected-content { flex: 1; min-width: 0; }
    .selected-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.75;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .selected-name {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
    }
    .selected-cat {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      font-size: 0.7rem;
      padding: 0.25rem 0.8rem;
      border-radius: 20px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 0.5rem;
    }
    .selected-banner.empty .selected-cat { background: #d5e0ec; }

    /* ---------- FORM ---------- */
    .form-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }
    .input-group {
      flex: 1 1 180px;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .input-group label {
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #2b4b6e;
    }
    .input-group input {
      padding: 0.9rem 1.2rem;
      border-radius: 60px;
      border: 1.5px solid #cbd5e1;
      background: white;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.15s;
      width: 100%;
    }
    .input-group input:focus {
      border-color: #1e4c7a;
      box-shadow: 0 0 0 3px rgba(30,76,122,0.15);
    }
    .btn {
      background: #1e4c7a;
      color: white;
      font-weight: 600;
      border: none;
      padding: 0.95rem 2rem;
      border-radius: 60px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 8px 16px -4px rgba(20,60,110,0.3);
      font-family: inherit;
      white-space: nowrap;
      height: fit-content;
    }
    .btn:hover { background: #123a5e; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; pointer-events: none; }
    .btn-secondary { background: #e2e8f0; color: #1e2e44; box-shadow: none; }
    .btn-secondary:hover { background: #cfdae6; }

    .message {
      margin-top: 1rem;
      padding: 0.9rem 1.5rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.95rem;
      background: #d9e8f7;
      color: #0b2b4f;
      display: none;
    }
    .message.show { display: block; }
    .message.error { background: #f8d7da; color: #8b1e2b; }
    .message.success { background: #d4edda; color: #155724; }

    /* ---------- PROJECTS ---------- */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .section-header h2 { font-size: 1.5rem; color: #0b2b4f; }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 0.9rem;
    }
    .project-card {
      background: white;
      border-radius: 20px;
      padding: 1.1rem 1.3rem;
      box-shadow: 0 6px 14px rgba(0,20,40,0.05);
      border: 1.5px solid #e2eaf2;
      transition: all 0.15s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      position: relative;
    }
    .project-card:hover:not(.taken) {
      border-color: #1e4c7a;
      transform: translateY(-2px);
      box-shadow: 0 12px 22px -8px rgba(20,60,110,0.18);
    }
    .project-card.selected {
      border-color: #1e4c7a;
      background: #eaf2fb;
      box-shadow: 0 0 0 3px rgba(30,76,122,0.18), 0 8px 18px -6px rgba(20,60,110,0.25);
    }
    .project-card.taken {
      background: #f2f6fb;
      border-color: #bdd3e8;
      cursor: not-allowed;
      opacity: 0.75;
    }
    .project-name {
      font-weight: 600;
      font-size: 1.05rem;
      color: #0b2b4f;
      line-height: 1.3;
    }
    .project-cat {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      font-weight: 600;
      color: #5b7b9c;
      background: #e9f0f7;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      align-self: flex-start;
    }
    .project-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.2rem;
      font-size: 0.8rem;
    }
    .taken-badge {
      background: #cbdae8;
      color: #1e3e5e;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.25rem 0.7rem;
      border-radius: 30px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .pick-indicator { color: #1e4c7a; font-weight: 500; }
    .project-card.taken .pick-indicator { display: none; }
    .project-card.selected .pick-indicator { color: #1e4c7a; font-weight: 700; }

    .team-info {
      font-size: 0.75rem;
      color: #4f6b88;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="back-link">← Back</a>
      <h1>🎮 Gameplay</h1>
      <p class="subtitle">Register your team and pick one project</p>
    </header>

    <!-- SELECTED PROJECT BANNER -->
    <div id="selectedBanner" class="selected-banner empty">
      <div class="selected-icon">📋</div>
      <div class="selected-content">
        <div class="selected-label">Selected project</div>
        <div class="selected-name" id="selectedName">No project selected yet</div>
        <div class="selected-cat" id="selectedCat" style="display:none;"></div>
      </div>
    </div>

    <!-- FORM -->
    <div class="card">
      <div class="form-grid">
        <div class="input-group">
          <label>Group name</label>
          <input type="text" id="groupName" placeholder="e.g. Team Alpha" autocomplete="off">
        </div>
        <div class="input-group">
          <label>Student number 1</label>
          <input type="text" id="student1" placeholder="e.g. 20240001" autocomplete="off">
        </div>
        <div class="input-group">
          <label>Student number 2</label>
          <input type="text" id="student2" placeholder="e.g. 20240002" autocomplete="off">
        </div>
        <button class="btn" id="registerBtn">Register team</button>
      </div>
      <div id="formMessage" class="message"></div>
    </div>

    <!-- PROJECTS -->
    <div class="card">
      <div class="section-header">
        <h2>📌 Available projects</h2>
        <button class="btn btn-secondary" id="refreshBtn" style="padding:0.5rem 1.1rem; font-size:0.85rem;">↻ Refresh</button>
      </div>
      <div id="projectsContainer" class="project-grid">
        <div style="padding:2rem; text-align:center; color:#4f6b88; grid-column:1/-1;">Loading projects…</div>
      </div>
    </div>
  </div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONFIGURATION
// ═══════════════════════════════════════════════════════════
const CLASS_ID = 'gameplay';
const CLASS_NAME = 'Gameplay';

<script>
  // ============================================================
  // 1. FIREBASE CONFIGURATION – REPLACE WITH YOUR OWN
  // ============================================================
   const firebaseConfig = {
  apiKey: "AIzaSyAFX4zlwK_VGEFbvdTV0FObiIFa2lmWF2I",
  authDomain: "ai-project-tool.firebaseapp.com",
  databaseURL: "https://ai-project-tool-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ai-project-tool",
  storageBucket: "ai-project-tool.firebasestorage.app",
  messagingSenderId: "658331100512",
  appId: "1:658331100512:web:72208dc0c1561b95bcaa05",
  measurementId: "G-R36B3T9FLW"
};


const DEFAULT_PROJECTS = [
  { id: 'adv_mini_jira', name: 'Mini Jira', category: 'Software Engineering' },
  { id: 'adv_mini_github', name: 'Mini GitHub', category: 'Software Engineering' },
  { id: 'adv_bug_tracking', name: 'Bug Tracking Platform', category: 'Software Engineering' },
  { id: 'adv_cicd_dashboard', name: 'CI/CD Dashboard', category: 'Software Engineering' },
  { id: 'adv_api_testing', name: 'API Testing Platform', category: 'Software Engineering' },
  { id: 'adv_requirements', name: 'Requirements Management System', category: 'Software Engineering' },
  { id: 'adv_prog_assessment', name: 'Programming Assessment Platform', category: 'Education' },
  { id: 'adv_learning_analytics', name: 'Learning Analytics Dashboard', category: 'Education' },
  { id: 'adv_virtual_lab', name: 'Virtual Laboratory Platform', category: 'Education' },
  { id: 'adv_timetabling', name: 'Automated Timetabling System', category: 'Education' },
  { id: 'adv_crm', name: 'CRM Platform', category: 'Business' },
  { id: 'adv_inventory', name: 'Inventory Management System', category: 'Business' },
  { id: 'adv_appointment', name: 'Appointment Scheduling Platform', category: 'Business' },
  { id: 'adv_support', name: 'Customer Support Platform', category: 'Business' },
  { id: 'adv_bi_dashboard', name: 'Business Intelligence Dashboard', category: 'Business' },
  { id: 'adv_sports_analytics', name: 'Sports Analytics Platform', category: 'Analytics' },
  { id: 'adv_financial_analytics', name: 'Financial Analytics Platform', category: 'Analytics' },
  { id: 'adv_traffic', name: 'Traffic Analysis Platform', category: 'Analytics' },
  { id: 'adv_environmental', name: 'Environmental Monitoring Dashboard', category: 'Analytics' },
  { id: 'adv_hospital_sim', name: 'Hospital Resource Simulator', category: 'Simulation' },
  { id: 'adv_airport_sim', name: 'Airport Operations Simulator', category: 'Simulation' },
  { id: 'adv_supply_chain', name: 'Supply Chain Simulator', category: 'Simulation' },
  { id: 'adv_smart_city', name: 'Smart City Simulator', category: 'Simulation' },
  { id: 'adv_emergency', name: 'Emergency Response Simulator', category: 'Simulation' },
  { id: 'adv_manufacturing', name: 'Manufacturing Process Simulator', category: 'Simulation' },
  { id: 'adv_asset', name: 'Asset Management System', category: 'Engineering' },
  { id: 'adv_fleet', name: 'Fleet Management Platform', category: 'Engineering' },
  { id: 'adv_smart_building', name: 'Smart Building Controller', category: 'Engineering' },
  { id: 'adv_network_mon', name: 'Network Monitoring Dashboard', category: 'Engineering' },
  { id: 'adv_iot_mon', name: 'IoT Monitoring System', category: 'Engineering' },
];
// ═══════════════════════════════════════════════════════════
//  FIREBASE
// ═══════════════════════════════════════════════════════════
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let allProjects = [];      // from /classes/{CLASS_ID}/projects
let takenProjects = {};    // from /classes/{CLASS_ID}/selections
let selectedProjectId = null;
let isRegistering = false;

// DOM
const groupNameInput = document.getElementById('groupName');
const student1Input = document.getElementById('student1');
const student2Input = document.getElementById('student2');
const registerBtn = document.getElementById('registerBtn');
const formMessage = document.getElementById('formMessage');
const projectsContainer = document.getElementById('projectsContainer');
const refreshBtn = document.getElementById('refreshBtn');
const selectedBanner = document.getElementById('selectedBanner');
const selectedName = document.getElementById('selectedName');
const selectedCat = document.getElementById('selectedCat');

// ═══════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════
function showMessage(text, type = 'info') {
  formMessage.textContent = text;
  formMessage.className = 'message show';
  if (type === 'error') formMessage.classList.add('error');
  if (type === 'success') formMessage.classList.add('success');
  clearTimeout(showMessage._t);
  showMessage._t = setTimeout(() => formMessage.classList.remove('show'), 5000);
}
function clearForm() {
  groupNameInput.value = '';
  student1Input.value = '';
  student2Input.value = '';
}
function setLoading(l) {
  registerBtn.disabled = l;
  registerBtn.innerHTML = l ? '<span class="loader"></span> Saving…' : 'Register team';
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ═══════════════════════════════════════════════════════════
//  SEED PROJECTS (if empty)
// ═══════════════════════════════════════════════════════════
async function ensureProjectsSeeded() {
  const ref = db.ref(`classes/${CLASS_ID}/projects`);
  const snap = await ref.once('value');
  if (!snap.exists()) {
    const obj = {};
    DEFAULT_PROJECTS.forEach(p => obj[p.id] = { name: p.name, category: p.category });
    await ref.set(obj);
  }
}

// ═══════════════════════════════════════════════════════════
//  LISTENERS
// ═══════════════════════════════════════════════════════════
function attachListeners() {
  db.ref(`classes/${CLASS_ID}/projects`).on('value', snap => {
    const data = snap.val() || {};
    allProjects = Object.entries(data).map(([id, v]) => ({ id, ...v }));
    renderProjects();
  });
  db.ref(`classes/${CLASS_ID}/selections`).on('value', snap => {
    takenProjects = snap.val() || {};
    renderProjects();
  });
}

// ═══════════════════════════════════════════════════════════
//  RENDER PROJECTS + BANNER
// ═══════════════════════════════════════════════════════════
function renderProjects() {
  const list = [...allProjects].sort((a, b) => {
    const at = !!takenProjects[a.id], bt = !!takenProjects[b.id];
    if (at !== bt) return at ? 1 : -1;
    return a.name.localeCompare(b.name);
  });

  if (list.length === 0) {
    projectsContainer.innerHTML =
      '<div style="padding:2rem; text-align:center; color:#4f6b88; grid-column:1/-1;">No projects configured yet. Ask your instructor.</div>';
    return;
  }

  projectsContainer.innerHTML = list.map(p => {
    const taken = takenProjects[p.id];
    const selected = selectedProjectId === p.id;
    return `
      <div class="project-card ${taken ? 'taken' : ''} ${selected ? 'selected' : ''}"
           data-id="${escapeHtml(p.id)}" data-taken="${!!taken}">
        <div class="project-name">${escapeHtml(p.name)}</div>
        <div class="project-cat">${escapeHtml(p.category || 'General')}</div>
        ${taken ? `<div class="team-info">👥 ${escapeHtml(taken.groupName)}</div>` : ''}
        <div class="project-footer">
          ${taken ? '<span class="taken-badge">🔒 taken</span>' : '<span class="pick-indicator">⬤ click to select</span>'}
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.project-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      const taken = card.dataset.taken === 'true';
      if (taken) { showMessage('This project is already taken.', 'error'); return; }
      selectedProjectId = (selectedProjectId === id) ? null : id;
      renderProjects();
      updateBanner();
    });
  });

  updateBanner();
}

function updateBanner() {
  if (!selectedProjectId) {
    selectedBanner.classList.add('empty');
    selectedName.textContent = 'No project selected yet';
    selectedCat.style.display = 'none';
    return;
  }
  const proj = allProjects.find(p => p.id === selectedProjectId);
  if (!proj) { selectedProjectId = null; return updateBanner(); }
  selectedBanner.classList.remove('empty');
  selectedName.textContent = proj.name;
  selectedCat.textContent = proj.category || 'General';
  selectedCat.style.display = 'inline-block';
}

// ═══════════════════════════════════════════════════════════
//  REGISTER
// ═══════════════════════════════════════════════════════════
registerBtn.addEventListener('click', async () => {
  if (isRegistering) return;
  const groupName = groupNameInput.value.trim();
  const s1 = student1Input.value.trim();
  const s2 = student2Input.value.trim();

  if (!groupName || !s1 || !s2) {
    return showMessage('Please fill in group name and both student numbers.', 'error');
  }
  if (!selectedProjectId) {
    return showMessage('Please click a project from the list to select it.', 'error');
  }
  if (takenProjects[selectedProjectId]) {
    return showMessage('That project was just taken. Pick another.', 'error');
  }

  isRegistering = true;
  setLoading(true);

  try {
    const ref = db.ref(`classes/${CLASS_ID}/selections/${selectedProjectId}`);
    const result = await ref.transaction(cur => {
      if (cur === null) {
        return {
          groupName,
          student1: s1,
          student2: s2,
          class: CLASS_NAME,
          timestamp: Date.now()
        };
      }
      return; // abort
    });

    if (!result.committed) {
      showMessage('Sorry — that project was taken by another team. Pick another.', 'error');
      selectedProjectId = null;
      renderProjects();
      return;
    }

    showMessage(`✅ Registered! ${groupName} → ${allProjects.find(p=>p.id===selectedProjectId)?.name}`, 'success');
    clearForm();
    selectedProjectId = null;
    updateBanner();
  } catch (e) {
    console.error(e);
    showMessage('Error: ' + e.message, 'error');
  } finally {
    isRegistering = false;
    setLoading(false);
  }
});

refreshBtn.addEventListener('click', () => {
  showMessage('Refreshed.', 'info');
  renderProjects();
});

[groupNameInput, student1Input, student2Input].forEach(i => {
  i.addEventListener('keypress', e => { if (e.key === 'Enter') registerBtn.click(); });
});

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
(async function init() {
  try {
    await ensureProjectsSeeded();
    attachListeners();
  } catch (e) {
    console.error(e);
    showMessage('Init failed: ' + e.message, 'error');
  }
})();
</script>
</body>
</html>
